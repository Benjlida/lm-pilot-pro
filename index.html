<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#054b36">

  <meta
    name="description"
    content="LM Pilot Pro UAD — Centre de pilotage logistique — Entrepôt Valence"
  >

  <link rel="manifest" href="./manifest.webmanifest">

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icône-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icône-192.png"
  >

  <title>LM Pilot Pro UAD</title>

  <style>

    :root {
      --green: #054b36;
      --green-dark: #023d2c;
      --lime: #d7ff31;
      --bg: #edf3f0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;

      background: var(--green);

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* =========================================================
       APPLICATION
       ========================================================= */

    .shell {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #ffffff;
    }


    iframe {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;

      background: #ffffff;
    }


    /* =========================================================
       ÉCRAN DE DÉMARRAGE
       ========================================================= */

    .loading {
      position: absolute;

      inset: 0;

      z-index: 1000;

      overflow: hidden;

      background: #054b36;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.45s ease,
        visibility 0.45s ease;
    }


    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    /* =========================================================
       IMAGE LM PILOT PRO

       IMPORTANT :
       "contain" oblige le navigateur à afficher
       TOUTE l'image, y compris ENTREPÔT VALENCE.
       ========================================================= */

    .splash-image {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      object-position: center center;

      display: block;

      z-index: 1;
    }


    /* =========================================================
       BANDEAU DE CHARGEMENT

       Il est remonté volontairement pour ne pas cacher
       ENTREPÔT VALENCE.
       ========================================================= */

    .loading-status {
      position: absolute;

      left: 50%;

      /*
       * On le place suffisamment haut pour laisser
       * complètement libre le bas de l'image.
       */
      bottom: 130px;

      transform: translateX(-50%);

      z-index: 10;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      min-width: 405px;

      padding: 13px 25px;

      border-radius: 30px;

      background: rgba(3, 72, 52, 0.94);

      color: #ffffff;

      font-size: 18px;
      font-weight: 800;

      letter-spacing: 0.2px;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.28);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }


    /* =========================================================
       POINT VERT ANIMÉ
       ========================================================= */

    .loading-dot {
      width: 15px;
      height: 15px;

      flex: 0 0 15px;

      border-radius: 50%;

      background: var(--lime);

      box-shadow:
        0 0 0 7px rgba(215, 255, 49, 0.10);

      animation:
        pulse 1.3s ease-in-out infinite;
    }


    @keyframes pulse {

      0% {
        transform: scale(0.85);
        opacity: 0.65;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }

      100% {
        transform: scale(0.85);
        opacity: 0.65;
      }

    }


    /* =========================================================
       MESSAGE DE SECOURS GOOGLE
       ========================================================= */

    .fallback {
      position: absolute;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      z-index: 20;

      display: none;

      align-items: center;

      gap: 10px;

      width: max-content;

      max-width:
        calc(100% - 30px);

      padding:
        10px 12px;

      border-radius: 12px;

      background: #ffffff;

      color: #173b30;

      font-size: 13px;
      font-weight: 800;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.18);
    }


    .fallback.show {
      display: flex;
    }


    .fallback button {
      border: 0;

      border-radius: 9px;

      padding:
        8px 12px;

      cursor: pointer;

      color: #ffffff;

      background:
        var(--green);

      font-weight: 900;

      white-space: nowrap;
    }


    .fallback button:hover {
      background:
        var(--green-dark);
    }


    /* =========================================================
       TABLETTE / PETIT ÉCRAN
       ========================================================= */

    @media (max-width: 900px) {

      .splash-image {
        width: 100%;
        height: 100%;

        object-fit: contain;

        object-position:
          center center;
      }


      .loading-status {

        bottom: 115px;

        min-width: 0;

        width: auto;

        max-width:
          calc(100% - 30px);

        padding:
          11px 18px;

        font-size: 15px;

        white-space: nowrap;
      }


      .loading-dot {

        width: 12px;
        height: 12px;

        flex-basis: 12px;
      }

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 520px) {

      .splash-image {

        width: 100%;
        height: 100%;

        object-fit: contain;

        object-position:
          center center;
      }


      .loading-status {

        bottom: 95px;

        width:
          calc(100% - 40px);

        min-width: 0;

        font-size: 13px;

        padding:
          10px 14px;

        white-space: normal;

        text-align: center;
      }


      .fallback {

        flex-direction: column;

        text-align: center;
      }

    }

  </style>
</head>


<body>

  <main class="shell">


    <!-- =====================================================
         ÉCRAN DE DÉMARRAGE LM PILOT PRO
         ===================================================== -->

    <div
      id="loading"
      class="loading"
    >


      <img
        class="splash-image"
        src="./splash-lm-pilot-pro.jpg"
        alt="LM Pilot Pro UAD — Entrepôt Valence"
      >


      <div class="loading-status">

        <span class="loading-dot"></span>

        <span>
          Chargement de LM Pilot Pro UAD
        </span>

      </div>


    </div>



    <!-- =====================================================
         APPLICATION GOOGLE APPS SCRIPT
         ===================================================== -->

    <iframe
      id="lmFrame"
      title="LM Pilot Pro UAD"
      allow="fullscreen; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>



    <!-- =====================================================
         SECOURS AUTHENTIFICATION GOOGLE
         ===================================================== -->

    <div
      id="fallback"
      class="fallback"
    >

      <span>
        Si l'authentification Google ne s'affiche pas correctement :
      </span>

      <button
        type="button"
        onclick="ouvrirExterne()"
      >
        Ouvrir LM Pilot
      </button>

    </div>


  </main>



  <script>

    /* =========================================================
       URL DE TON APPLICATION GOOGLE APPS SCRIPT
       ========================================================= */

    const APPS_SCRIPT_URL =
      "https://script.google.com/a/macros/leroymerlin.fr/s/AKfycbx2Mt7fk2DqDT-bH7FruekdPqVLKgF_NdGHOlTleB_7rcTkwgESaJcL3uIdfZLkDzcA6A/exec";



    /* =========================================================
       CONSTRUCTION DE L'URL
       ========================================================= */

    function targetUrl() {

      const q =
        new URLSearchParams(
          window.location.search
        );


      const page =
        (q.get("page") || "")
          .trim();


      if (!page) {

        return APPS_SCRIPT_URL;

      }


      return (
        APPS_SCRIPT_URL +
        "?page=" +
        encodeURIComponent(page)
      );

    }



    /* =========================================================
       ÉLÉMENTS HTML
       ========================================================= */

    const frame =
      document.getElementById(
        "lmFrame"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const fallback =
      document.getElementById(
        "fallback"
      );



    /* =========================================================
       OUVERTURE DE LM PILOT
       ========================================================= */

    frame.src =
      targetUrl();



    /* =========================================================
       FIN DU CHARGEMENT
       ========================================================= */

    frame.addEventListener(
      "load",
      function () {


        /*
         * On garde le splash visible un court instant.
         */

        setTimeout(
          function () {

            loading
              .classList
              .add("hidden");

          },
          850
        );


        /*
         * Bouton de secours Google.
         */

        setTimeout(
          function () {

            fallback
              .classList
              .add("show");

          },
          2500
        );

      }
    );



    /* =========================================================
       OUVERTURE EXTERNE
       ========================================================= */

    function ouvrirExterne() {

      window.open(
        targetUrl(),
        "_blank",
        "noopener"
      );

    }



    /* =========================================================
       SERVICE WORKER
       ========================================================= */

    if (
      "serviceWorker"
      in navigator
    ) {

      window.addEventListener(
        "load",
        function () {

          navigator
            .serviceWorker
            .register(
              "./service-worker.js"
            )
            .catch(
              function (error) {

                console.error(
                  "Erreur Service Worker :",
                  error
                );

              }
            );

        }
      );

    }

  </script>

</body>
</html>
