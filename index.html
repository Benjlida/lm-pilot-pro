<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#054b36">
  <meta name="description" content="LM Pilot Pro UAD — Centre de pilotage logistique">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>LM Pilot Pro UAD</title>
  <style>
    :root { --green:#054b36; --lime:#d7ff31; --bg:#edf3f0; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); font-family:Arial,Helvetica,sans-serif; }
    .shell { width:100%; height:100%; position:relative; background:#fff; }
    iframe { width:100%; height:100%; border:0; display:block; background:#fff; }
    .loading {
      position:absolute; inset:0; z-index:5; display:grid; place-items:center;
      background:linear-gradient(145deg,#073d2e,#0b6749);
      color:#fff; transition:opacity .25s ease;
    }
    .loading.hidden { opacity:0; pointer-events:none; }
    .brand { text-align:center; }
    .mark {
      width:92px; height:92px; margin:0 auto 18px; display:grid; place-items:center;
      border:4px solid var(--lime); border-radius:20px; font-size:30px; font-weight:950;
    }
    .brand h1 { margin:0; font-size:28px; }
    .brand p { margin:8px 0 0; color:var(--lime); font-weight:900; }
    .fallback {
      position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
      z-index:6; display:none; gap:8px; align-items:center;
      padding:10px 12px; border-radius:12px; background:#fff; box-shadow:0 8px 28px rgba(0,0,0,.18);
      color:#173b30; font-size:13px; font-weight:800;
    }
    .fallback.show { display:flex; }
    .fallback button {
      border:0; border-radius:9px; padding:8px 10px; cursor:pointer; color:#fff; background:var(--green); font-weight:900;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div id="loading" class="loading">
      <div class="brand">
        <div class="mark">LM</div>
        <h1>LM Pilot Pro UAD</h1>
        <p>Centre de pilotage logistique</p>
      </div>
    </div>

    <iframe id="lmFrame"
      title="LM Pilot Pro UAD"
      allow="fullscreen; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <div id="fallback" class="fallback">
      <span>Si l'authentification Google ne s'affiche pas correctement dans l'application :</span>
      <button type="button" onclick="ouvrirExterne()">Ouvrir LM Pilot</button>
    </div>
  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/a/macros/leroymerlin.fr/s/AKfycbxnVjiuKP8PbK86oAwpYb1K7_wgyCt73jN6BHemP2CRfv9QuA7u7uA7B3de_A3kf5eX/exec";

    function targetUrl() {
      const q = new URLSearchParams(location.search);
      const page = (q.get('page') || '').trim();
      if (!page) return APPS_SCRIPT_URL;
      return APPS_SCRIPT_URL + '?page=' + encodeURIComponent(page);
    }

    const frame = document.getElementById('lmFrame');
    const loading = document.getElementById('loading');
    const fallback = document.getElementById('fallback');

    frame.src = targetUrl();

    frame.addEventListener('load', () => {
      loading.classList.add('hidden');
      setTimeout(() => fallback.classList.add('show'), 1800);
    });

    function ouvrirExterne() {
      window.open(targetUrl(), '_blank', 'noopener');
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
