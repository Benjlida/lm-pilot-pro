<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#054b36">

  <meta
    name="description"
    content="LM Pilot Pro UAD — Centre de pilotage logistique — Entrepôt Valence"
  >

  <link rel="manifest" href="./manifest.webmanifest">

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icône-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icône-192.png"
  >

  <title>LM Pilot Pro UAD</title>

  <style>

    :root {
      --green: #054b36;
      --green-dark: #023d2c;
      --lime: #d7ff31;
      --bg: #edf3f0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background: var(--green);

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* =========================================================
       APPLICATION
       ========================================================= */

    .shell {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #ffffff;
    }


    iframe {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;

      background: #ffffff;
    }


    /* =========================================================
       ÉCRAN DE DÉMARRAGE
       ========================================================= */

    .loading {
      position: absolute;

      inset: 0;

      z-index: 1000;

      overflow: hidden;

      background: #054b36;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.45s ease,
        visibility 0.45s ease;
    }


    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    /* =========================================================
       IMAGE LM PILOT PRO
       
       CONTAIN = toute l'image reste visible
       ========================================================= */

    .splash-image {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center center;

      display: block;

      z-index: 1;

      user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================================================
       PETIT BANDEAU DE CHARGEMENT
       
       Placé en bas pour ne plus cacher :
       - les 4 pictogrammes
       - le milieu du visuel
       - le titre
       ========================================================= */

    .loading-status {
      position: absolute;

      left: 50%;
      bottom: 42px;

      transform: translateX(-50%);

      z-index: 10;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 9px;

      padding: 8px 16px;

      border-radius: 22px;

      background: rgba(3, 72, 52, 0.92);

      color: #ffffff;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 0.1px;

      white-space: nowrap;

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.20);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }


    /* =========================================================
       POINT VERT ANIMÉ
       ========================================================= */

    .loading-dot {
      width: 10px;
      height: 10px;

      flex: 0 0 10px;

      border-radius: 50%;

      background: var(--lime);

      box-shadow:
        0 0 0 4px rgba(215, 255, 49, 0.10);

      animation:
        pulse 1.3s ease-in-out infinite;
    }


    @keyframes pulse {

      0% {
        transform: scale(0.85);
        opacity: 0.65;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }

      100% {
        transform: scale(0.85);
        opacity: 0.65;
      }

    }


    /* =========================================================
       MESSAGE DE SECOURS GOOGLE
       ========================================================= */

    .fallback {
      position: absolute;

      left: 50%;
      bottom: 10px;

      transform: translateX(-50%);

      z-index: 20;

      display: none;

      align-items: center;

      gap: 10px;

      width: max-content;

      max-width: calc(100% - 30px);

      padding: 10px 12px;

      border-radius: 12px;

      background: #ffffff;

      color: #173b30;

      font-size: 13px;
      font-weight: 800;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.18);
    }


    .fallback.show {
      display: flex;
    }


    .fallback button {
      border: 0;

      border-radius: 9px;

      padding: 8px 12px;

      cursor: pointer;

      color: #ffffff;

      background: var(--green);

      font-weight: 900;

      white-space: nowrap;
    }


    .fallback button:hover {
      background: var(--green-dark);
    }


    /* =========================================================
       TABLETTE / PETIT ÉCRAN
       ========================================================= */

    @media (max-width: 900px) {

      .splash-image {
        width: 100%;
        height: 100%;

        object-fit: contain;
        object-position: center center;
      }


      .loading-status {
        bottom: 38px;

        min-width: 0;

        max-width: calc(100% - 30px);

        padding: 8px 14px;

        font-size: 12px;
      }


      .loading-dot {
        width: 9px;
        height: 9px;

        flex-basis: 9px;
      }

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 520px) {

      .splash-image {
        width: 100%;
        height: 100%;

        object-fit: contain;
        object-position: center center;
      }


      .loading-status {
        bottom: 32px;

        max-width: calc(100% - 30px);

        padding: 7px 12px;

        font-size: 11px;

        white-space: nowrap;
      }


      .loading-dot {
        width: 8px;
        height: 8px;

        flex-basis: 8px;
      }


      .fallback {
        flex-direction: column;

        text-align: center;
      }

    }

  </style>
</head>


<body>

  <main class="shell">


    <!-- =====================================================
         ÉCRAN DE DÉMARRAGE
         ===================================================== -->

    <div
      id="loading"
      class="loading"
    >

      <img
        class="splash-image"
        src="./splash-lm-pilot-pro.jpg"
        alt="LM Pilot Pro UAD — Entrepôt Valence"
      >


      <div class="loading-status">

        <span class="loading-dot"></span>

        <span>
          Chargement de LM Pilot Pro UAD
        </span>

      </div>

    </div>



    <!-- =====================================================
         APPLICATION GOOGLE APPS SCRIPT
         ===================================================== -->

    <iframe
      id="lmFrame"
      title="LM Pilot Pro UAD"
      allow="fullscreen; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>



    <!-- =====================================================
         SECOURS AUTHENTIFICATION GOOGLE
         ===================================================== -->

    <div
      id="fallback"
      class="fallback"
    >

      <span>
        Si l'authentification Google ne s'affiche pas correctement :
      </span>

      <button
        type="button"
        onclick="ouvrirExterne()"
      >
        Ouvrir LM Pilot
      </button>

    </div>


  </main>



  <script>

    /* =========================================================
       URL GOOGLE APPS SCRIPT
       ========================================================= */

    const APPS_SCRIPT_URL =
      "https://script.google.com/a/macros/leroymerlin.fr/s/AKfycbx2Mt7fk2DqDT-bH7FruekdPqVLKgF_NdGHOlTleB_7rcTkwgESaJcL3uIdfZLkDzcA6A/exec";


    /* =========================================================
       CONSTRUCTION DE L'URL
       ========================================================= */

    function targetUrl() {

      const q =
        new URLSearchParams(
          window.location.search
        );


      const page =
        (q.get("page") || "")
          .trim();


      if (!page) {
        return APPS_SCRIPT_URL;
      }


      return (
        APPS_SCRIPT_URL +
        "?page=" +
        encodeURIComponent(page)
      );

    }


    /* =========================================================
       ÉLÉMENTS
       ========================================================= */

    const frame =
      document.getElementById("lmFrame");

    const loading =
      document.getElementById("loading");

    const fallback =
      document.getElementById("fallback");


    /* =========================================================
       CHARGEMENT APPLICATION
       ========================================================= */

    frame.src = targetUrl();


    /* =========================================================
       UNE FOIS L'APPLICATION CHARGÉE
       ========================================================= */

    frame.addEventListener(
      "load",
      function () {

        /*
         * Petit délai pour afficher proprement
         * l'écran LM Pilot Pro.
         */

        setTimeout(
          function () {

            loading
              .classList
              .add("hidden");

          },
          850
        );


        /*
         * Bouton de secours si problème
         * d'authentification Google.
         */

        setTimeout(
          function () {

            fallback
              .classList
              .add("show");

          },
          2500
        );

      }
    );


    /* =========================================================
       OUVERTURE EXTERNE
       ========================================================= */

    function ouvrirExterne() {

      window.open(
        targetUrl(),
        "_blank",
        "noopener"
      );

    }


    /* =========================================================
       SERVICE WORKER PWA
       ========================================================= */

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function () {

          navigator
            .serviceWorker
            .register("./service-worker.js")
            .catch(
              function (error) {

                console.error(
                  "Erreur Service Worker :",
                  error
                );

              }
            );

        }
      );

    }

  </script>

</body>
</html>
