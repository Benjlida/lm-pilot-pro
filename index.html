<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#054b36">

  <meta
    name="description"
    content="LM Pilot Pro UAD — Centre de pilotage logistique — Entrepôt Valence"
  >

  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="icon" type="image/png" sizes="192x192" href="./icône-192.png">
  <link rel="apple-touch-icon" href="./icône-192.png">

  <title>LM Pilot Pro UAD</title>

  <style>
    :root {
      --green: #054b36;
      --green-dark: #023d2c;
      --lime: #d7ff31;
      --bg: #edf3f0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--green);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================================================
       APPLICATION
       ========================================================= */

    .shell {
      width: 100%;
      height: 100%;
      position: relative;
      background: #ffffff;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }

    /* =========================================================
       ÉCRAN DE CHARGEMENT
       ========================================================= */

    .loading {
      position: absolute;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--green);

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.45s ease,
        visibility 0.45s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* =========================================================
       IMAGE SPLASH
       ========================================================= */

    .splash-image {
      position: absolute;

      top: 0;
      left: 50%;

      transform: translateX(-50%);

      height: 100%;
      width: auto;

      max-width: 100%;

      object-fit: contain;
      object-position: center;

      display: block;

      z-index: 1;
    }

    /* =========================================================
       BANDEAU DE CHARGEMENT

       IMPORTANT :
       il est volontairement remonté afin de laisser apparaître
       "ENTREPÔT VALENCE" situé en bas de l'image.
       ========================================================= */

    .loading-status {
      position: absolute;

      left: 50%;
      bottom: 105px;

      transform: translateX(-50%);

      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      min-width: 405px;

      padding: 13px 25px;

      border-radius: 30px;

      background: rgba(3, 72, 52, 0.94);

      color: #ffffff;

      font-size: 18px;
      font-weight: 800;

      letter-spacing: 0.2px;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.28);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    /* =========================================================
       POINT ANIMÉ
       ========================================================= */

    .loading-dot {
      width: 15px;
      height: 15px;

      flex: 0 0 15px;

      border-radius: 50%;

      background: var(--lime);

      box-shadow:
        0 0 0 7px rgba(215, 255, 49, 0.10);

      animation: pulse 1.3s ease-in-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.85);
        opacity: 0.65;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }

      100% {
        transform: scale(0.85);
        opacity: 0.65;
      }
    }

    /* =========================================================
       FALLBACK AUTHENTIFICATION GOOGLE
       ========================================================= */

    .fallback {
      position: absolute;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      z-index: 20;

      display: none;
      align-items: center;

      gap: 10px;

      width: max-content;
      max-width: calc(100% - 30px);

      padding: 10px 12px;

      border-radius: 12px;

      background: #ffffff;

      color: #173b30;

      font-size: 13px;
      font-weight: 800;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.18);
    }

    .fallback.show {
      display: flex;
    }

    .fallback button {
      border: 0;

      border-radius: 9px;

      padding: 8px 12px;

      cursor: pointer;

      color: #ffffff;
      background: var(--green);

      font-weight: 900;

      white-space: nowrap;
    }

    .fallback button:hover {
      background: var(--green-dark);
    }

    /* =========================================================
       PETITS ÉCRANS
       ========================================================= */

    @media (max-width: 900px) {

      .splash-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .loading-status {
        bottom: 90px;

        min-width: 0;
        width: auto;
        max-width: calc(100% - 30px);

        padding: 11px 18px;

        font-size: 15px;

        white-space: nowrap;
      }

      .loading-dot {
        width: 12px;
        height: 12px;
        flex-basis: 12px;
      }
    }

    /* =========================================================
       TRÈS PETITS ÉCRANS
       ========================================================= */

    @media (max-width: 520px) {

      .loading-status {
        bottom: 75px;

        width: calc(100% - 40px);

        font-size: 13px;

        padding: 10px 14px;
      }

      .fallback {
        flex-direction: column;
        text-align: center;
      }
    }

  </style>
</head>


<body>

  <main class="shell">

    <!-- =======================================================
         ÉCRAN DE DÉMARRAGE
         ======================================================= -->

    <div id="loading" class="loading">

      <img
        class="splash-image"
        src="./splash-lm-pilot-pro.jpg"
        alt="LM Pilot Pro UAD — Entrepôt Valence"
      >

      <!-- Bandeau remonté pour ne plus masquer Entrepôt Valence -->

      <div class="loading-status">

        <span class="loading-dot"></span>

        <span>
          Chargement de LM Pilot Pro UAD
        </span>

      </div>

    </div>


    <!-- =======================================================
         APPLICATION GOOGLE APPS SCRIPT
         ======================================================= -->

    <iframe
      id="lmFrame"
      title="LM Pilot Pro UAD"
      allow="fullscreen; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>


    <!-- =======================================================
         SOLUTION DE SECOURS GOOGLE
         ======================================================= -->

    <div id="fallback" class="fallback">

      <span>
        Si l'authentification Google ne s'affiche pas correctement :
      </span>

      <button
        type="button"
        onclick="ouvrirExterne()"
      >
        Ouvrir LM Pilot
      </button>

    </div>

  </main>


  <script>

    /* =========================================================
       URL GOOGLE APPS SCRIPT
       ========================================================= */

    const APPS_SCRIPT_URL =
      "https://script.google.com/a/macros/leroymerlin.fr/s/AKfycbx2Mt7fk2DqDT-bH7FruekdPqVLKgF_NdGHOlTleB_7rcTkwgESaJcL3uIdfZLkDzcA6A/exec";


    /* =========================================================
       CONSTRUCTION DE L'URL
       ========================================================= */

    function targetUrl() {

      const q = new URLSearchParams(window.location.search);

      const page = (q.get("page") || "").trim();

      if (!page) {
        return APPS_SCRIPT_URL;
      }

      return (
        APPS_SCRIPT_URL +
        "?page=" +
        encodeURIComponent(page)
      );
    }


    /* =========================================================
       ÉLÉMENTS
       ========================================================= */

    const frame =
      document.getElementById("lmFrame");

    const loading =
      document.getElementById("loading");

    const fallback =
      document.getElementById("fallback");


    /* =========================================================
       CHARGEMENT DE LM PILOT
       ========================================================= */

    frame.src = targetUrl();


    frame.addEventListener("load", function () {

      /*
       * Petit délai volontaire :
       * permet de voir proprement l'écran LM Pilot Pro
       * avant l'ouverture de l'application.
       */

      setTimeout(function () {

        loading.classList.add("hidden");

      }, 650);


      /*
       * Affichage du bouton de secours.
       */

      setTimeout(function () {

        fallback.classList.add("show");

      }, 2200);

    });


    /* =========================================================
       OUVERTURE EXTERNE
       ========================================================= */

    function ouvrirExterne() {

      window.open(
        targetUrl(),
        "_blank",
        "noopener"
      );

    }


    /* =========================================================
       SERVICE WORKER PWA
       ========================================================= */

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function () {

        navigator.serviceWorker
          .register("./service-worker.js")
          .catch(function (error) {

            console.error(
              "Erreur Service Worker :",
              error
            );

          });

      });

    }

  </script>

</body>
</html>
