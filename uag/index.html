<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075c43">
  <meta name="description" content="LM Pilot Pro UAG — Centre de pilotage logistique — Entrepôt Valence">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-uag-192.png">
  <link rel="apple-touch-icon" href="./icon-uag-192.png">
  <title>LM Pilot Pro UAG</title>
  <style>
    :root{
      --green:#033d2d;
      --green-2:#075c43;
      --green-3:#08704e;
      --lime:#d7ff31;
      --ink:#08291f;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--green);font-family:Arial,Helvetica,sans-serif}
    .shell{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .splash{
      position:absolute;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;
      overflow:hidden;color:#fff;background:
        radial-gradient(circle at 82% 18%,rgba(215,255,49,.18),transparent 30%),
        radial-gradient(circle at 15% 85%,rgba(255,255,255,.10),transparent 28%),
        linear-gradient(135deg,var(--green),var(--green-2) 58%,var(--green-3));
      opacity:1;visibility:visible;transition:opacity .45s ease,visibility .45s ease;
    }
    .splash::before,.splash::after{
      content:"";position:absolute;border:1px solid rgba(215,255,49,.18);border-radius:50%;
    }
    .splash::before{width:520px;height:520px;right:-180px;top:-210px}
    .splash::after{width:380px;height:380px;left:-170px;bottom:-190px}
    .splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .card{
      position:relative;z-index:2;width:min(760px,100%);padding:clamp(28px,5vw,54px);
      text-align:center;border:1px solid rgba(255,255,255,.18);border-radius:34px;
      background:rgba(2,48,35,.72);box-shadow:0 30px 90px rgba(0,0,0,.32);backdrop-filter:blur(12px);
    }
    .logo{width:clamp(112px,17vw,170px);height:auto;filter:drop-shadow(0 14px 24px rgba(0,0,0,.28))}
    .eyebrow{margin:24px 0 8px;color:var(--lime);font-size:clamp(13px,2vw,17px);font-weight:900;letter-spacing:2px;text-transform:uppercase}
    h1{margin:0;font-size:clamp(38px,7vw,72px);line-height:.98;letter-spacing:-2px}
    .subtitle{margin:18px auto 0;max-width:620px;color:#e3efeb;font-size:clamp(16px,2.4vw,22px);font-weight:700;line-height:1.45}
    .status{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:34px;font-size:15px;font-weight:900}
    .dot{width:11px;height:11px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 6px rgba(215,255,49,.12);animation:pulse 1.25s ease-in-out infinite}
    .progress{height:4px;margin:25px auto 0;max-width:430px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.12)}
    .progress span{display:block;width:36%;height:100%;border-radius:inherit;background:var(--lime);animation:move 1.35s linear infinite}
    .fallback{
      position:absolute;left:50%;bottom:20px;z-index:50;display:none;align-items:center;gap:12px;
      transform:translateX(-50%);max-width:calc(100% - 28px);padding:12px 14px;border-radius:16px;
      background:#fff;color:var(--ink);font-size:13px;font-weight:800;box-shadow:0 12px 34px rgba(0,0,0,.2);
    }
    .fallback.show{display:flex}
    .fallback button{border:0;border-radius:10px;padding:9px 13px;cursor:pointer;background:var(--green-2);color:#fff;font-weight:900;white-space:nowrap}
    @keyframes pulse{0%,100%{transform:scale(.82);opacity:.65}50%{transform:scale(1.15);opacity:1}}
    @keyframes move{from{transform:translateX(-110%)}to{transform:translateX(310%)}}
    @media(max-width:640px){
      .card{border-radius:26px}
      .fallback{width:calc(100% - 24px);flex-direction:column;text-align:center}
      .fallback button{width:100%}
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="splash" class="splash" aria-label="Chargement de LM Pilot Pro UAG">
      <div class="card">
        <img class="logo" src="./icon-uag.svg" alt="LM Pilot Pro UAG">
        <div class="eyebrow">Entrepôt Valence · Unité UAG</div>
        <h1>LM Pilot Pro UAG</h1>
        <p class="subtitle">Centre de pilotage logistique pour organiser les ressources, suivre l’activité et accompagner les équipes.</p>
        <div class="status"><span class="dot"></span><span>Chargement de l’application UAG</span></div>
        <div class="progress" aria-hidden="true"><span></span></div>
      </div>
    </section>

    <iframe
      id="lmFrame"
      title="LM Pilot Pro UAG"
      allow="fullscreen; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

    <div id="fallback" class="fallback">
      <span>Si l’authentification Google ne s’affiche pas correctement :</span>
      <button type="button" onclick="ouvrirExterne()">Ouvrir LM Pilot UAG</button>
    </div>
  </main>

  <script>
    const APPS_SCRIPT_URL =
      "https://script.google.com/a/macros/leroymerlin.fr/s/AKfycbz21esYvJSq4y_9dmSMB6GYytPoRAWyGwD9feTm2Zlyh6aCVS4vaDipitawj_wB54zZMg/exec";

    function targetUrl() {
      const target = new URL(APPS_SCRIPT_URL);
      const params = new URLSearchParams(window.location.search);
      params.forEach(function(value, key) {
        target.searchParams.set(key, value);
      });
      return target.toString();
    }

    const frame = document.getElementById("lmFrame");
    const splash = document.getElementById("splash");
    const fallback = document.getElementById("fallback");
    const startedAt = Date.now();
    const minimumSplash = 1400;
    let loaded = false;

    frame.src = targetUrl();

    frame.addEventListener("load", function() {
      loaded = true;
      const remaining = Math.max(0, minimumSplash - (Date.now() - startedAt));
      setTimeout(function() {
        splash.classList.add("hidden");
      }, remaining);
    });

    frame.addEventListener("error", function() {
      splash.classList.add("hidden");
      fallback.classList.add("show");
    });

    setTimeout(function() {
      if (!loaded) fallback.classList.add("show");
    }, 10000);

    function ouvrirExterne() {
      window.open(targetUrl(), "_blank", "noopener");
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./service-worker.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
